<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Reklam Popup Engelleyici</title>
<style>
  :root { color-scheme: light dark; }
  body {
    width: 280px; margin: 0; padding: 14px 16px 16px;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #1c1a24; background: #fff;
  }
  @media (prefers-color-scheme: dark) {
    body { color: #eee; background: #1b1826; }
    .card { background: #262133 !important; }
    .muted { color: #a9a2c0; }
  }
  h1 { font-size: 15px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  .card {
    background: #f4f2fb; border-radius: 10px; padding: 12px; margin-bottom: 10px;
  }
  .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .row:last-child { margin-bottom: 0; }
  .muted { color: #6b6480; font-size: 12px; }
  .count { font-size: 26px; font-weight: 700; }
  button {
    border: none; border-radius: 8px; padding: 8px 10px; font-size: 12.5px;
    cursor: pointer; background: #7c5cff; color: #fff; width: 100%;
  }
  button.secondary { background: transparent; color: #7c5cff; border: 1px solid #7c5cff; }
  button:disabled { opacity: 0.5; cursor: default; }
  .switch { position: relative; width: 40px; height: 22px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0; background: #ccc; border-radius: 22px; cursor: pointer; transition: .15s;
  }
  .slider::before {
    content: ""; position: absolute; width: 18px; height: 18px; left: 2px; top: 2px;
    background: #fff; border-radius: 50%; transition: .15s;
  }
  input:checked + .slider { background: #7c5cff; }
  input:checked + .slider::before { transform: translateX(18px); }
  a { color: #7c5cff; font-size: 12px; text-decoration: none; }
  .host { font-weight: 600; word-break: break-all; }
</style>
</head>
<body>
  <h1>🛡️ Reklam Popup Engelleyici</h1>

  <div class="card row">
    <span>Eklenti aktif</span>
    <label class="switch">
      <input type="checkbox" id="enabledToggle">
      <span class="slider"></span>
    </label>
  </div>

  <div class="card">
    <div class="muted">Bu sayfada engellenen</div>
    <div class="count" id="blockedCount">0</div>
  </div>

  <div class="card">
    <div class="muted" style="margin-bottom:6px;">Site: <span class="host" id="currentHost">-</span></div>
    <button id="whitelistBtn" class="secondary">Bu sitede devre dışı bırak</button>
  </div>

  <div class="row" style="margin-top: 4px;">
    <a href="#" id="optionsLink">Ayarlar</a>
    <span class="muted" id="totalBlocked"></span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
